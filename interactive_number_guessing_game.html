<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom animations and base styles */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            min-height: 100vh;
        }

        .shake {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .bounce {
            animation: bounce 0.5s;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full text-center relative overflow-hidden">
        
        <!-- Background decorative elements -->
        <div class="absolute -top-10 -left-10 w-32 h-32 bg-yellow-300 rounded-full mix-blend-multiply filter blur-xl opacity-70"></div>
        <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-orange-300 rounded-full mix-blend-multiply filter blur-xl opacity-70"></div>

        <h1 class="text-3xl font-extrabold text-gray-800 mb-2 relative z-10">Guess the Number</h1>
        <p class="text-gray-600 mb-6 relative z-10">I'm thinking of a number between <span class="font-bold text-orange-500">1</span> and <span class="font-bold text-orange-500">50</span>.</p>

        <div class="mb-6 relative z-10">
            <div class="flex justify-between text-sm text-gray-500 mb-2 font-semibold">
                <span>Attempts Left: <span id="attemptsLeft" class="text-red-500 text-lg">5</span></span>
            </div>
            
            <div class="flex gap-2">
                <input type="number" id="guessInput" min="1" max="50" placeholder="Enter your guess (1-50)" 
                    class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none transition-all text-lg text-center"
                    onkeypress="handleKeyPress(event)">
                <button id="guessButton" onclick="makeGuess()" 
                    class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg shadow-orange-500/30 transition-all transform hover:scale-105 active:scale-95">
                    Guess
                </button>
            </div>
        </div>

        <div id="feedbackContainer" class="hidden mb-6 relative z-10">
            <div id="feedbackMessage" class="text-lg font-bold p-4 rounded-xl">
                <!-- Feedback messages will appear here -->
            </div>
        </div>

        <!-- Play Again Button (Hidden by default) -->
        <button id="resetButton" onclick="initGame()" class="hidden relative z-10 w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-all transform hover:scale-105">
            Play Again
        </button>
    </div>

    <script>
        // Game State Variables
        let targetNumber;
        let attemptsLeft;
        const maxAttempts = 5;

        // DOM Elements
        const guessInput = document.getElementById('guessInput');
        const guessButton = document.getElementById('guessButton');
        const attemptsLeftDisplay = document.getElementById('attemptsLeft');
        const feedbackContainer = document.getElementById('feedbackContainer');
        const feedbackMessage = document.getElementById('feedbackMessage');
        const resetButton = document.getElementById('resetButton');

        // Initialize the game when the window loads
        window.onload = initGame;

        function initGame() {
            // Generate a random integer between 1 and 50
            targetNumber = Math.floor(Math.random() * 50) + 1;
            attemptsLeft = maxAttempts;
            
            // Reset UI
            attemptsLeftDisplay.textContent = attemptsLeft;
            guessInput.value = '';
            guessInput.disabled = false;
            guessButton.disabled = false;
            feedbackContainer.classList.add('hidden');
            resetButton.classList.add('hidden');
            
            // Focus input for immediate playability
            guessInput.focus();
        }

        // Allow pressing 'Enter' to submit a guess
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                makeGuess();
            }
        }

        function makeGuess() {
            const guessVal = parseInt(guessInput.value);

            // Input Validation
            if (isNaN(guessVal) || guessVal < 1 || guessVal > 50) {
                showFeedback("Please enter a valid number between 1 and 50.", "bg-yellow-100 text-yellow-800 border-2 border-yellow-300", true);
                return;
            }

            // Decrement attempts
            attemptsLeft--;
            attemptsLeftDisplay.textContent = attemptsLeft;

            // Evaluate the guess based on the logic provided in the Python code
            if (guessVal === targetNumber) {
                handleWin();
            } else if (guessVal > targetNumber) {
                const diff = Math.abs(targetNumber - guessVal);
                if (diff <= 5) {
                    showFeedback("Close but high! Try again.", "bg-blue-100 text-blue-800 border-2 border-blue-300", true);
                } else if (diff <= 10) {
                    showFeedback("High! Try again.", "bg-blue-100 text-blue-800 border-2 border-blue-300", true);
                } else {
                    showFeedback("Too high! Try again.", "bg-blue-200 text-blue-900 border-2 border-blue-400", true);
                }
            } else if (guessVal < targetNumber) {
                 const diff = Math.abs(targetNumber - guessVal);
                if (diff <= 5) {
                    showFeedback("Close but low! Try again.", "bg-purple-100 text-purple-800 border-2 border-purple-300", true);
                } else if (diff <= 10) {
                    showFeedback("Low! Try again.", "bg-purple-100 text-purple-800 border-2 border-purple-300", true);
                } else {
                    showFeedback("Too low! Try again.", "bg-purple-200 text-purple-900 border-2 border-purple-400", true);
                }
            }

            // Check for loss condition
            if (attemptsLeft === 0 && guessVal !== targetNumber) {
                handleLoss();
            }
            
            // Clear input for next guess if game is still active
            if(attemptsLeft > 0 && guessVal !== targetNumber) {
                 guessInput.value = '';
                 guessInput.focus();
            }
        }

        function showFeedback(message, classes, shake = false) {
            feedbackContainer.classList.remove('hidden');
            
            // Reset classes to apply new ones cleanly
            feedbackMessage.className = `text-lg font-bold p-4 rounded-xl ${classes}`;
            feedbackMessage.textContent = message;

            if (shake) {
                feedbackMessage.classList.remove('shake');
                // Trigger reflow to restart animation
                void feedbackMessage.offsetWidth; 
                feedbackMessage.classList.add('shake');
            }
        }

        function handleWin() {
            showFeedback(`🎉 You win! The number was ${targetNumber}!`, "bg-green-100 text-green-800 border-2 border-green-400 bounce");
            endGame();
        }

        function handleLoss() {
            showFeedback(`Game Over! You lost. The number was ${targetNumber}.`, "bg-red-100 text-red-800 border-2 border-red-400");
            endGame();
        }

        function endGame() {
            guessInput.disabled = true;
            guessButton.disabled = true;
            resetButton.classList.remove('hidden');
            resetButton.focus(); // Move focus to replay button
        }
    </script>
</body>
</html>
